<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <style>
        html, body {
            background: #191919 !important; /* Originales Notion Dark Mode Dunkelgrau */
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff !important; /* Strahlend weiße Schrift */
            text-align: left; 
            padding: 10px;
        }
        #time-display {
            font-size: 36px; /* Etwas größer als das Datum, damit es gut wirkt */
            font-weight: 600; /* Leicht fettgedruckt für bessere Lesbarkeit */
        }
    </style>
</head>
<body>

<div id="time-display"></div>

<script>
    function updateTime() {
        const now = new Date();
        
        // Formatiert die Uhrzeit passend für Deutschland im 24-Stunden-Format
        const zeitString = now.toLocaleTimeString('de-DE', {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        });

        document.getElementById("time-display").innerText = zeitString;
    }
    
    // Uhrzeit sofort anzeigen und jede Sekunde (1000ms) aktualisieren
    updateTime();
    setInterval(updateTime, 1000);
</script>

</body>
</html>
