<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <style>
        html, body {
            background: #191919 !important; /* Originales Notion Dark Mode Dunkelgrau */
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff !important; /* Strahlend weiße Schrift */
            text-align: left; 
            padding: 10px;
        }
        #greeting-display {
            font-size: 48px; 
            font-weight: 600; 
        }
    </style>
</head>
<body>

<div id="greeting-display"></div>

<script>
    function updateGreeting() {
        const now = new Date();
        const stunde = now.getHours();
        let begruessung = "";

        // Dynamische Begrüßung je nach Tageszeit
        if (stunde >= 5 && stunde < 11) {
            begruessung = "Guten Morgen";
        } else if (stunde >= 11 && stunde < 18) {
            begruessung = "Guten Tag";
        } else if (stunde >= 18 && stunde < 23) {
            begruessung = "Guten Abend";
        } else {
            begruessung = "Gute Nacht";
        }

        // Personalisierte Ausgabe
        document.getElementById("greeting-display").innerText = `${begruessung}, Michael!`;
    }
    
    // Begrüßung sofort anzeigen und alle 15 Minuten im Hintergrund prüfen
    updateGreeting();
    setInterval(updateGreeting, 60000 * 15);
</script>

</body>
</html>
