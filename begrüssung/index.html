
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <style>
        html, body {
            background: #191919 !important; /* Originales Notion Dark Mode Dunkelgrau */
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff !important; /* Strahlend weiße Schrift */
            text-align: left; 
            padding: 10px;
        }
        #greeting-display {
            font-size: 48px; 
            font-weight: 600; 
            display: flex;
            align-items: center;
            gap: 12px; /* Abstand zwischen Icon und Text */
        }
    </style>
</head>
<body>

<div id="greeting-display"></div>

<script>
    function updateGreeting() {
        const now = new Date();
        const stunde = now.getHours();
        let begruessung = "";
        let icon = "";

        // Dynamische Begrüßung und Icons je nach Tageszeit
        if (stunde >= 5 && stunde < 11) {
            begruessung = "Guten Morgen";
            icon = "🌅"; // Sonnenaufgang
        } else if (stunde >= 11 && stunde < 18) {
            begruessung = "Guten Tag";
            icon = "☀️"; // Sonne
        } else if (stunde >= 18 && stunde < 23) {
            begruessung = "Guten Abend";
            icon = "🌆"; // Abendhimmel
        } else {
            begruessung = "Gute Nacht";
            icon = "🌙"; // Sichelmond
        }

        // Personalisierte Ausgabe mit Icon
        document.getElementById("greeting-display").innerHTML = `<span>${icon}</span> <span>${begruessung}, Michael!</span>`;
    }
    
    // Sofort ausführen und alle 15 Minuten prüfen
    updateGreeting();
    setInterval(updateGreeting, 60000 * 15);
</script>

</body>
</html>
