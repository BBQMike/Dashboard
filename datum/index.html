<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <style>
        html, body {
            background: #191919 !important; /* Das originale Notion Dark Mode Dunkelgrau */
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff; /* Reines, klares Weiß */
            text-align: left; 
            padding: 10px;
        }
        #date-display {
            font-size: 28px; 
            font-weight: 400; 
        }
    </style>
</head>
<body>

<div id="date-display"></div>

<script>
    function updateDate() {
        const now = new Date();
        const wochentage = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
        const monate = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
        
        const tagName = wochentage[now.getDay()];
        const tag = String(now.getDate()).padStart(2, '0');
        const monatName = monate[now.getMonth()];
        const jahr = now.getFullYear();

        const datumsString = `${tagName}, ${tag}. ${monatName} ${jahr}`;
        document.getElementById("date-display").innerText = datumsString;
    }
    
    updateDate();
</script>

</body>
</html>
