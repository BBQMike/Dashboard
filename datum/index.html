<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <style>
        html, body {
            background: #191919 !important; /* Originales Notion Dark Mode Dunkelgrau */
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff !important; /* Strahlend weiße Schrift */
            text-align: left; 
            padding: 10px;
        }
        #date-display {
            font-size: 36px; 
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px; /* Abstand zwischen Icon und Text */
        }
    </style>
</head>
<body>

<div id="date-display"></div>

<script>
    function updateDate() {
        const now = new Date();
        
        // Formatiert das Datum (z.B. "Sonntag, 7. Juni 2026")
        const optionen = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const datumString = now.toLocaleDateString('de-DE', optionen);

        const icon = "📅"; // Kalender-Icon

        // Ausgabe mit Icon
        document.getElementById("date-display").innerHTML = `<span>${icon}</span> <span>${datumString}</span>`;
    }
    
    // Sofort anzeigen und alle 15 Minuten aktualisieren
    updateDate();
    setInterval(updateDate, 60000 * 15);
</script>

</body>
</html>
